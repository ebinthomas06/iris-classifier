project_name: "iris-classifier"
framework: "xgboost"
task_type: "classification"
entry_point: "ml/train.py"
predict_module: "ml/predict.py"
target_column: "species"
numerical_features:
  - "sepal_length"
  - "sepal_width"
  - "petal_length"
  - "petal_width"
categorical_features: []
metrics_threshold:
  accuracy: 0.92
  f1: 0.90
dependencies: "requirements.txt"
dataset_path: "data/iris.csv"
xgboost:
  n_trials: 30
  max_depth_range: [3, 8]
  lr_range: [0.01, 0.3]
